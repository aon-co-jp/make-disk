[package]
name = "make-disk"
version = "0.1.9"
description = "Cross-platform CD/DVD/Blu-ray writing & format conversion GUI"
authors = ["aon-co-jp"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "make_disk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CPU命令セット(AVX2/AVX512等)のランタイム検出。GPUハードウェア
# エンコーダが見つからない場合のCPUフォールバック(libx264)が
# どの程度実用的な速度になりそうかをUIで伝えるために使う。
open-cpu = { git = "https://github.com/aon-co-jp/open-cpu" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 自動アップデート確認(2026-09-16新設)。デスクトップのみ対応
# (Android/iOSはストア/APKサイドロードでの更新が前提のため対象外)。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
# Tauri標準のtauri-plugin-dialogはモバイルでのフォルダ選択を意図的に
# 未実装としているため(Cargo.tomlに"Does not support folder picker"と
# 明記)、Android向けにSAF(ACTION_OPEN_DOCUMENT_TREE)を扱う自前プラグインを
# 追加する。desktopでは標準のdialogプラグインで問題無く動くため、
# Android限定の依存にしてビルドコストを増やさない。
tauri-plugin-android-folder = { path = "plugins/tauri-plugin-android-folder" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
